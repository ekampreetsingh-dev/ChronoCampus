<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      try {
        var t = localStorage.getItem('chronocampus.theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="ChronoCampus — academic operations, intelligently organized. Timetables, substitutions and enrollment for schools."
    />
